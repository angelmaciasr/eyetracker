[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eye-sentinel"
version = "0.1.0"
description = "MVP local de deteccion de cierres oculares prolongados"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe>=0.10.30,<0.11",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
eye-sentinel = "eyetracker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eyetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
